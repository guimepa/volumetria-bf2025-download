<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Download — Base de volumetria Black Friday 2025</title>
<style>
:root{--bg:#0f172a;--card:#111c33;--line:#24314f;--ink:#e6edf7;--muted:#94a3b8;--acc:#6366f1}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 700px at 20% -10%,#1e293b 0%,#0f172a 60%);color:var(--ink);
  font:15px/1.5 "Segoe UI",system-ui,Roboto,Helvetica,Arial,sans-serif}
.card{width:100%;max-width:520px;background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:30px 30px 26px;box-shadow:0 24px 60px rgba(0,0,0,.45)}
h1{font-size:21px;margin:0 0 6px}
p.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px}
label{display:block;font-size:12.5px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
input[type=password]{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);
  background:#0b1428;color:var(--ink);font-size:15px;letter-spacing:.5px}
input[type=password]:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.row{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
button{border:0;border-radius:10px;padding:12px 20px;font-size:14.5px;font-weight:600;cursor:pointer;
  background:var(--acc);color:#fff;transition:.15s}
button:hover{filter:brightness(1.1)}
button[disabled]{opacity:.55;cursor:default}
button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.msg{margin-top:16px;font-size:13.5px;border-radius:10px;padding:11px 13px;display:none}
.msg.err{display:block;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.4);color:#fecaca}
.msg.ok{display:block;background:rgba(16,185,129,.12);border:1px solid rgba(16,185,129,.4);color:#a7f3d0}
.meta{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);
  display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hint{margin-top:10px;font-size:12.5px;color:var(--muted)}
</style>
</head>

<script>
(function(){
  'use strict';
  var P=JSON.parse(document.getElementById('payload').textContent);
  var form=document.getElementById('form'), pw=document.getElementById('pw'),
      msg=document.getElementById('msg'), go=document.getElementById('go'), show=document.getElementById('show');

  function b64(s){
    var b=atob(s), a=new Uint8Array(b.length);
    for(var i=0;i<b.length;i++) a[i]=b.charCodeAt(i);
    return a;
  }
  function say(cls,txt){ msg.className='msg '+cls; msg.textContent=txt; }

  document.getElementById('mName').textContent=P.name;
  document.getElementById('mSize').textContent=(P.bytes/1024).toFixed(0).replace('.',',')+' KB';

  show.addEventListener('click',function(){
    var hid=pw.type==='password';
    pw.type=hid?'text':'password';
    show.textContent=hid?'Ocultar senha':'Mostrar senha';
    pw.focus();
  });

  async function deriveKey(pass){
    var enc=new TextEncoder();
    var base=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);
    return crypto.subtle.deriveKey(
      {name:'PBKDF2',salt:b64(P.salt),iterations:P.it,hash:'SHA-256'},
      base,{name:'AES-GCM',length:256},false,['decrypt']);
  }

  form.addEventListener('submit',async function(e){
    e.preventDefault();
    if(!pw.value){ say('err','Informe a senha.'); return; }
    go.disabled=true; say('','');
    try{
      var key=await deriveKey(pw.value);
      var pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(P.nonce)},key,b64(P.data));
      var blob=new Blob([pt],{type:'text/csv;charset=utf-8'});
      var a=document.createElement('a');
      a.href=URL.createObjectURL(blob);
      a.download=P.name;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
      say('ok','Download liberado: '+P.name);
      pw.value='';
    }catch(err){
      say('err','Senha incorreta ou arquivo adulterado.');
    }finally{
      go.disabled=false;
    }
  });
})();
</script>
